# H\u00e1\u00bb\u0097 tr\u00e1\u00bb\u00a3 t\u00e1\u00bb\u0091i \u00c4\u0091a 500 ng\u00c6\u00b0\u00e1\u00bb\u009di ch\u00c6\u00a1i
server.maxplayer=500
server.expserver=3
server.debug=false
server.name=NRO KID
server.domain=https://ngocrongkid.online/

## C\u00e1\u00ba\u00a5u h\u00c3\u00acnh API
api.port=8080
