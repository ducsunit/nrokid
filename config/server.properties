## C\u00e1\u00ba\u00a5u h\u00c3\u00acnh server ch\u00c3\u00adnh
server.sv=1
server.port=14445
# \u00c3\u0089p server s\u00e1\u00bb\u00ad d\u00e1\u00bb\u00a5ng IPv4
server.ip=0.0.0.0  
server.sv1=Localhost:127.0.0.1:14445:0,0,0
# T\u00c4\u0083ng th\u00e1\u00bb\u009di gian ch\u00e1\u00bb\u009d \u00c4\u0091\u00c4\u0083ng nh\u00e1\u00ba\u00adp l\u00e1\u00ba\u00a1i \u00c4\u0091\u00e1\u00bb\u0083 tr\u00c3\u00a1nh m\u00e1\u00ba\u00a5t k\u00e1\u00ba\u00bft n\u00e1\u00bb\u0091i
server.waitlogin=30
# T\u00c4\u0083ng gi\u00e1\u00bb\u009bi h\u00e1\u00ba\u00a1n t\u00c3\u00a0i kho\u00e1\u00ba\u00a3n/IP n\u00e1\u00ba\u00bfu c\u00c3\u00b3 nhi\u00e1\u00bb\u0081u t\u00c3\u00a0i kho\u00e1\u00ba\u00a3n c\u00c3\u00b9ng l\u00c3\u00bac
